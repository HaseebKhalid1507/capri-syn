# cargo-about's config (installer/licenses/third-party.ps1): the licences of the crates compiled into
# her binary. A crate's licence expression must be satisfiable from this list, or the generation
# fails (--fail): a new licence in Cargo.lock is a decision, made here. Earlier in the list wins when a
# crate offers a choice (MIT first: the shortest text).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "NCSA",
    "CDLA-Permissive-2.0",
]

# Test-only crates aren't in her binary. Build dependencies stay listed: some generate code into it.
ignore-dev-dependencies = true

# Her own crates (publish = false: synaps-avatar, synaps-client) aren't third-party: LICENSE, and
# synaps-client's NOTICE and LICENSE-APACHE, ship as files beside this one (installer/licenses/list).
private = { ignore = true }

# cargo-about's built-in clarifications for crates whose licence files a scan misreads.
workarounds = ["chrono", "linux-raw-sys", "ring", "rustix", "rustls", "unicode-ident"]

# File-level copyleft, crate by crate (never in the list above: a new MPL crate is a decision too).
# Unmodified; its source is on crates.io at the version listed, as the generated file's header says
# (MPL-2.0 3.2). The only one in her Linux and Windows builds: Cargo.lock's other two, cbindgen (GPUI's
# macOS platform) and dwrote (font-kit's, which her Windows build doesn't use), aren't. cargo-about
# reads crate tables last.
[option-ext]
accepted = ["MPL-2.0"]
