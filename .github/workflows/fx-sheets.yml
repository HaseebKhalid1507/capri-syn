name: fx-sheets

# Contact sheets of the teleport bolt and the music notes (src/fx.rs, `fx::sheets`), for tuning
# them by eye: the bolt painted through `bolt_rects`, the notes through the view's quantisation.
# Uploaded as the `fx-sheets` artifact.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/fx.rs
      - .github/workflows/fx-sheets.yml

# Reads the code and uploads an artifact; nothing else.
permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: fx-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: System libraries (GPUI on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # ci.yml's cache, read only (that job saves it).
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Contact sheets
        env:
          FX_SHEETS: ${{ runner.temp }}/fx-sheets
        run: cargo test --locked --bin synaps-avatar fx::sheets -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: fx-sheets
          path: ${{ runner.temp }}/fx-sheets
          if-no-files-found: error
          retention-days: 14
