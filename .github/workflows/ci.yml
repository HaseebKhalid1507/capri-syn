name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (GPUI on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # The unit tests are pure (session link, packs' pure parts, effects, shapes): no display, no GPU.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      # The crates' licences for the Linux tarball (installer/licenses/third-party.ps1, as release.yml's
      # linux job makes them): a dependency that brings a licence nobody accepted, a crate with no
      # copyright line, or syntect back fails on its PR, not on the tag. Windows': windows-installer.
      - name: The crates' licences (Linux)
        shell: pwsh
        run: ./installer/licenses/third-party.ps1 -Target x86_64-unknown-linux-gnu -Out "$env:RUNNER_TEMP/third-party.txt"

  # The compile gate for Windows (x86_64-pc-windows-msvc, the runner's host): build, the unit tests
  # (the fake contract suite in both modes among them) and clippy. The Windows contract suite proper
  # needs a desktop (`contract_windows`, ignored here: run it in the capri-win VM).
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      # No PDBs for the dev/test builds: a smaller cache and faster links.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      # The registry and the dependencies' build (the workspace's own crates pruned); saved on a
      # failed run too, so a red run still warms the next.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --locked --bin synaps-avatar

      - name: Tests
        if: ${{ !cancelled() }}
        # The voice link's test against the real Python end (capri_voice_win.serve).
        env:
          CAPRI_VOICE_TEST_PY: python
        run: cargo test --locked --workspace

      # Its log says which way a plain show leaves an effect layer unpainted on this Windows (the
      # first erase inside the show, or none before it returns): the dark-first-frame diagnosis.
      - name: Effect layer goes up filled (log)
        if: ${{ !cancelled() }}
        run: cargo test --locked --bin synaps-avatar a_layer_goes_up_already_filled -- --nocapture

      - name: Fake contract suite (target events, polled)
        if: ${{ !cancelled() }}
        run: cargo test --locked --bin synaps-avatar contract_fake -- --nocapture

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # capri-voice's checks that need no mic, speaker or model, on both OSes: its --selftest rules and
  # tools/test_capri_voice.py (the capture seam; the Windows layer: the link's handshake, duck/pause
  # rules and crash repair on fake sessions, the call check). Mic, speaker and model checks: [VM].
  voice:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 3.13: what the Windows bundle would ship (kokoro-onnx wants < 3.14).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Packages (numpy)
        run: python -m pip install --disable-pip-version-check -q numpy

      # Windows: the bundle's whole set from wheels only (none may need a compiler), then imported,
      # so the binding checks in the unit tests run against the real packages.
      - name: The Windows bundle's wheels (binary only) and their imports
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check -q --only-binary :all: -r tools/capri-voice-win-requirements.txt
          python -c "import kokoro_onnx, pywhispercpp.model, onnxruntime, sounddevice, pycaw.pycaw, winrt.windows.media.control; print('imports ok, onnxruntime', onnxruntime.__version__, onnxruntime.get_available_providers())"

      - name: Unit tests
        run: python tools/test_capri_voice.py

      - name: Selftest (no models)
        if: ${{ !cancelled() }}
        env:
          CAPRI_VOICE_MODELS: ${{ runner.temp }}/no-models
        run: python tools/capri-voice --selftest

      # capri-watch (Linux only: systemd units, a Unix socket): stdlib unit tests on fake sources.
      - name: capri-watch tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python tools/capri-watch/test_capri_watch.py

      # The Windows bundle (packaging/windows/voice-bundle.ps1: CPython's embeddable package + the
      # wheels), then the selftest and the unit tests again, run by the bundled interpreter.
      - name: The voice bundle, run by its own interpreter
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          CAPRI_VOICE_MODELS: ${{ runner.temp }}/no-models
        run: |
          ./packaging/windows/voice-bundle.ps1 -Out "$env:RUNNER_TEMP\voice"
          $py = "$env:RUNNER_TEMP\voice\python\python.exe"
          & $py -c "import sys, kokoro_onnx, pywhispercpp.model, onnxruntime, sounddevice, pycaw.pycaw, winrt.windows.media.control; print('bundle imports ok:', sys.version.split()[0], sys.path)"
          if ($LASTEXITCODE) { throw "imports: $LASTEXITCODE" }
          & $py "$env:RUNNER_TEMP\voice\capri-voice" --selftest
          if ($LASTEXITCODE) { throw "selftest: $LASTEXITCODE" }
          & $py tools/test_capri_voice.py
          if ($LASTEXITCODE) { throw "unit tests: $LASTEXITCODE" }
          Get-Content "$env:RUNNER_TEMP\voice\versions.txt"

  # Her per-user installer (Inno Setup, packaging/windows): the windowed release build, the
  # installer as an artifact (never released or published), then unattended installs, checks and
  # uninstalls on the runner: offline, a CapriCore that doesn't match its pins, /PACK=download over a
  # pack of his, a pack folder of his. No art in it: her art is downloaded on the machine.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      # The release build's own cache (the `windows` job's is a dev build).
      # Not ~/.cargo/bin: a Synaps an earlier run installed there would come back.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          cache-on-failure: true
          cache-bin: false

      # As the release builds her (release.yml): symbols beside the exe, so a dump of a CI build reads.
      - name: Build the installer
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: ./packaging/windows/build.ps1

      - name: Install, check, uninstall (unattended; offline, a bad pin, /PACK=download)
        timeout-minutes: 40
        shell: pwsh
        run: ./packaging/windows/test-install.ps1 -Setup (Get-ChildItem packaging/windows/Output/capri-syn-setup-*.exe | Select-Object -First 1).FullName

      # Voice is its own download (windows-voice-installer): hers must stay small.
      - name: Her installer stays small (no voice in it)
        shell: pwsh
        run: |
          $s = (Get-ChildItem packaging/windows/Output/capri-syn-setup-*.exe | Select-Object -First 1).Length
          Write-Output "her installer: $([math]::Round($s / 1MB, 1)) MB"
          if ($s -gt 20MB) { throw "her installer is $([math]::Round($s / 1MB, 1)) MB: over 20 MB" }

      # install.ps1's path guard and recorded folders, on Windows paths (no install).
      - name: install.ps1's units
        shell: powershell
        run: ./installer/test-units.ps1

      # steps.ps1 login against a stand-in synaps.exe: the whole sign-in URL, stdin held open.
      - name: Her sign-in step
        shell: powershell
        run: ./packaging/windows/test-login.ps1

      # install.ps1 end to end with the installer this job built, as his own user: dry runs that
      # touch nothing (also fetched from GitHub at this commit: as a scriptblock, and the real
      # `irm | iex`, which must leave the session as it was), the install (--yes --no-autostart),
      # synaps --version, her --check, the daemon, a rerun, --uninstall; a --prefix with spaces over
      # a pack he made (moved aside, kept); --purge (her files only).
      - name: install.ps1 with this installer
        timeout-minutes: 25
        shell: pwsh
        run: ./installer/test-windows.ps1 -Setup (Get-ChildItem packaging/windows/Output/capri-syn-setup-*.exe | Select-Object -First 1).FullName -Ref ${{ github.event.pull_request.head.sha || github.sha }}

      # Her release exe, offline (no daemon), a minute of clicks and carries on her: every WM_NULL
      # answered (within 1 s, or 10 s on a retry), no WER event, no panic (the "not responding"
      # hang of 2026-11-19: her UI thread and her click-through poller waited on each other).
      # Last: it leaves her state. On a failure, -Out keeps her log and a minidump of her.
      - name: She keeps answering through a minute of clicks (offline)
        timeout-minutes: 15
        shell: pwsh
        run: ./tests/windows/test-hang.ps1 -Exe target/release/synaps-avatar.exe -Out "$env:RUNNER_TEMP/sa-hang"

      - name: Her log and a dump of her, from a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sa-hang
            target/release/synaps_avatar.pdb
          retention-days: 7
          if-no-files-found: warn

      - name: Her symbols (the PDB of this build's exe)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: synaps-avatar-pdb-${{ github.sha }}
          path: target/release/synaps_avatar.pdb
          retention-days: 14
          if-no-files-found: warn

      # Uploaded even when the run above fails (a flake cost main 7b401ea its installer).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: capri-syn-setup-${{ github.sha }}
          path: packaging/windows/Output/capri-syn-setup-*.exe
          retention-days: 14
          if-no-files-found: error

      # Her quit is bounded (2 s after her bye) and frees her exe: unlocked, with her teardown held
      # (the watchdog ends her), then with the session locked, as on his box when a quit stayed and
      # pinned her exe. Last: the lock stays.
      - name: Her quit, unlocked, held and locked
        timeout-minutes: 5
        shell: pwsh
        run: ./tests/windows/test-quit.ps1 -Exe target/release/synaps-avatar.exe -Locked -Out "$env:RUNNER_TEMP/sa-quit"

      - name: Her logs from a failed quit
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-quit-${{ github.sha }}
          path: ${{ runner.temp }}/sa-quit
          retention-days: 7
          if-no-files-found: ignore

  # Her installer end to end, on a clean runner, as someone with nothing installed gets it: unattended
  # with its defaults, then Synaps, its daemon, her pack, her attached (not OFFLINE) and responsive for
  # 60 s of clicks, and an uninstall that leaves nothing of hers (test-setup-e2e.ps1).
  windows-setup-e2e:
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capri-syn-setup-${{ github.sha }}
          path: setup

      - name: Her installer, its defaults, end to end
        timeout-minutes: 35
        shell: pwsh
        run: ./packaging/windows/test-setup-e2e.ps1 -Setup (Get-ChildItem setup/capri-syn-setup-*.exe | Select-Object -First 1).FullName -Shots shots

      - name: Her logs
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($f in @("$env:LOCALAPPDATA\synaps-avatar\synaps-avatar.log", "$env:TEMP\capri-setup-e2e-*.log")) { Get-ChildItem $f -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_ -Tail 200 } }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: capri-syn-setup-e2e-shots-${{ github.sha }}
          path: shots
          retention-days: 14
          if-no-files-found: warn

  # Her installer's wizard, clicked through with its defaults on a clean runner: a screenshot of every
  # page, of her on the desktop after "Start her now", and of the uninstall's questions.
  windows-setup-wizard:
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capri-syn-setup-${{ github.sha }}
          path: setup

      - name: Her wizard, every page
        timeout-minutes: 35
        shell: powershell
        run: ./packaging/windows/test-setup-wizard.ps1 -Setup (Get-ChildItem setup/capri-syn-setup-*.exe | Select-Object -First 1).FullName -Shots shots

      - name: Her logs
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($f in @("$env:LOCALAPPDATA\synaps-avatar\synaps-avatar.log", "$env:TEMP\capri-setup-wizard-*.log")) { Get-ChildItem $f -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_ -Tail 200 } }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: capri-syn-setup-wizard-shots-${{ github.sha }}
          path: shots
          retention-days: 14
          if-no-files-found: warn

  # Her installer with her voice, unattended on a clean runner (/VOICE=on, and the voice installer
  # the job below built, as a release's would be downloaded): the bundle and its selftest, the
  # models, settings.toml through her own writer, the sidecar started by her, and an uninstall
  # that leaves no voice (test-setup-voice.ps1).
  windows-setup-voice:
    needs: [windows-installer, windows-voice-installer]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capri-syn-setup-${{ github.sha }}
          path: setup

      - uses: actions/download-artifact@v4
        with:
          name: capri-syn-voice-setup-${{ github.sha }}
          path: setup

      - name: Her installer, /VOICE=on
        timeout-minutes: 35
        shell: pwsh
        run: ./packaging/windows/test-setup-voice.ps1 -Setup (Get-ChildItem setup/capri-syn-setup-*.exe | Select-Object -First 1).FullName

      - name: Her logs
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($f in @("$env:LOCALAPPDATA\synaps-avatar\synaps-avatar.log", "$env:TEMP\capri-setup-voice-*.log")) { Get-ChildItem $f -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_ -Tail 200 } }

  # Her voice installer (packaging/windows/synaps-avatar-voice.iss): the bundle beside her, as its
  # own download. Built, installed, checked and uninstalled unattended (without the models); then
  # the model fetch on its small files (resume, a bad hash). An artifact, never released.
  windows-voice-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the voice installer
        shell: pwsh
        run: ./packaging/windows/build-voice.ps1

      - name: Install, check, uninstall (unattended)
        timeout-minutes: 15
        shell: pwsh
        run: ./packaging/windows/test-voice-install.ps1 -Setup (Get-ChildItem packaging/windows/Output/capri-syn-voice-setup-*.exe | Select-Object -First 1).FullName

      - name: The model fetch (small files; resume, a bad hash)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: ./packaging/windows/test-voice-models.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: capri-syn-voice-setup-${{ github.sha }}
          path: packaging/windows/Output/capri-syn-voice-setup-*.exe
          retention-days: 14
          if-no-files-found: error

  # The installers (docs/INSTALL.md): shellcheck and PSScriptAnalyzer, the two kept in step (flags,
  # steps, manifest keys), and install.sh's dry runs (from the checkout, and from GitHub at this
  # commit as `curl | bash` users get it) touching nothing.
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAPRI_INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Lua parser and installer stub tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4
          lua -v
          luac -v

      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -x install.sh installer/stage.sh installer/test-units.sh installer/licenses/check.sh installer/release-notes.sh tools/capri-voice-setup

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $found = foreach ($f in 'install.ps1', 'installer/test-windows.ps1', 'installer/test-units.ps1', 'packaging/windows/steps.ps1', 'packaging/windows/test-install.ps1', 'packaging/windows/test-setup-e2e.ps1', 'packaging/windows/test-setup-wizard.ps1', 'packaging/windows/test-wizard-window.ps1', 'packaging/windows/test-setup-voice.ps1', 'packaging/windows/test-login.ps1', 'installer/licenses/third-party.ps1', 'installer/licenses/check.ps1', 'packaging/windows/build.ps1', 'packaging/windows/build-voice.ps1', 'packaging/windows/voice-bundle.ps1', 'packaging/windows/test-voice-install.ps1') { Invoke-ScriptAnalyzer -Path $f -Severity Warning, Error }
          $found | Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 220
          if ($found) { throw "PSScriptAnalyzer: $(@($found).Count) finding(s)" }
          Write-Output 'PSScriptAnalyzer: clean'

      - name: The two installers in step
        run: python3 installer/test_parity.py -v

      # The Linux artifact's layout (installer/stage.sh) with a stand-in binary: her LICENSE and every
      # notice that goes with her binary, the repo's bytes, and the wake-word model's NOTICE beside it.
      # The crates' licences need cargo: release.yml's linux job checks the real tarball with them.
      - name: Her licence and notices in the Linux layout
        run: |
          bash installer/stage.sh . /bin/true "$RUNNER_TEMP/stage" ci
          bash installer/licenses/check.sh . "$RUNNER_TEMP/stage"

      # A tag's notes are CHANGELOG.md's section for it (release.yml): it must keep parsing.
      - name: The release notes (CHANGELOG.md)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bash installer/release-notes.sh --dry-run "$v" > "$RUNNER_TEMP/notes.md"
          echo "the notes for $v: $(wc -l < "$RUNNER_TEMP/notes.md") lines"; head -n 3 "$RUNNER_TEMP/notes.md"

      - name: install.sh's start of her (which runs it quits, ssh, her log, her folder) and --voice's PipeWire tools and Python
        run: bash installer/test-units.sh

      - name: install.sh --dry-run touches nothing
        run: |
          touch /tmp/marker && sleep 1
          bash install.sh --dry-run | tee /tmp/dry.log
          # It ends by starting her the way autostart does (off Hyprland and i3: XWayland), prints that
          # command; a dry run asks no brain (later, said).
          grep -q '\$ env SA_BACKEND=x11 .*/synaps-avatar &' /tmp/dry.log
          grep -q 'start her: env SA_BACKEND=x11 ~/.local/bin/synaps-avatar &' /tmp/dry.log
          grep -q "(asks which brain: an account, a model on this machine, an API key, or later)" /tmp/dry.log
          grep -q "her brain: later. she shows NO BRAIN YET" /tmp/dry.log
          if grep -q 'login --provider' /tmp/dry.log; then echo "::error::a dry run with no --brain signed in"; exit 1; fi
          # The full pack by default (mochi's art; the x2 strips as the manifest's pack_upscale says), and the opt-outs.
          grep -q 'make-pack .* --lachy auto --mochi auto$' /tmp/dry.log
          grep -q 'her pack .*capri (CapriCore v1.0.4 + lachy + mochi)' /tmp/dry.log
          bash install.sh --dry-run --no-local-art --upscale >/tmp/dry-x2.log
          grep -q 'make-pack .* --lachy auto --upscale$' /tmp/dry-x2.log
          grep -q -- '--index-url https://download.pytorch.org/whl/cpu torch==2.15.0$' /tmp/dry-x2.log
          grep -q -- "--no-cache-dir scipy 'numpy>=1.26,<3' 'Pillow>=10,<14'$" /tmp/dry-x2.log
          bash install.sh --dry-run --upscale --no-upscale >/tmp/dry-no-x2.log
          grep -q 'make-pack .* --lachy auto --mochi auto$' /tmp/dry-no-x2.log
          bash install.sh --dry-run --from-source --voice --watch
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CAPRI_INSTALL_REF}/install.sh" | bash -s -- --dry-run --with-local-art
          bash install.sh --dry-run --uninstall --purge
          bash install.sh --dry-run --prefix "$RUNNER_TEMP/My Apps" --no-autostart
          CAPRI_INSTALL_FLAGS='--dry-run --voice' bash install.sh | grep -q 'dry run: nothing was'
          if sudo -n true 2>/dev/null; then
            if sudo bash install.sh --dry-run >/tmp/root.log 2>&1; then echo "::error::root without --allow-root wasn't refused"; exit 1; fi
            grep -q 'running as root' /tmp/root.log
            if sudo env HOME="$HOME" bash install.sh --dry-run --allow-root >/tmp/root.log 2>&1; then echo "::error::root with his HOME wasn't refused"; exit 1; fi
            grep -q 'not root.s home' /tmp/root.log
            echo "root: refused without --allow-root, and always with someone else's HOME"
          fi
          changed=$( { find ~/.local ~/.config ~/.cache ~/.cargo/bin ~/.synaps-cli -newer /tmp/marker 2>/dev/null || true; } | head -20)
          if [ -n "$changed" ]; then echo "::error::the dry runs changed:"; echo "$changed"; exit 1; fi
          echo "the dry runs changed nothing in ~/.local ~/.config ~/.cache ~/.cargo/bin ~/.synaps-cli"
