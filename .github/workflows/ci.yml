name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (GPUI on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # synaps-client comes from the private synaps-desktop repo (Cargo.toml pins the rev).
      - name: Access to synaps-desktop
        env:
          TOKEN: ${{ secrets.SYNAPS_DESKTOP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::set the SYNAPS_DESKTOP_TOKEN secret (read access to HaseebKhalid1507/synaps-desktop)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/HaseebKhalid1507/synaps-desktop".insteadOf \
            "https://github.com/HaseebKhalid1507/synaps-desktop"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # The unit tests are pure (session link, packs' pure parts, effects, shapes): no display, no GPU.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked
