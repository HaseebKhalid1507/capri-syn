[package]
name = "synaps-avatar"
description = "Desktop companion overlay for a Synaps session."
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "synaps-avatar"
path = "src/main.rs"

[dependencies]
# The Synaps daemon client, from the public synaps-desk repo: an exact rev.
# MPRIS playback (real "listening"): the zbus GPUI already builds, plus its blocking API.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
synaps-client = { git = "https://github.com/HaseebKhalid1507/synaps-desk", rev = "4101e93483127d7b31e84b4aeaa21a678fbd2955" }
# Longbridge's GPUI Kit pins Zed's GPUI snapshot exactly; both pins are spelled out so neither drifts.
gpui-kit = { version = "=0.9.1", features = ["syntect", "profiler"] }
gpui-pre = "=0.3.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
async-channel = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
fast_image_resize = "6"
sha2 = "0.10"
raw-window-handle = "0.6"
log = "0.4"
libc = "0.2"
x11rb = { version = "0.13", features = ["shape", "randr", "xfixes", "screensaver", "xinput"] }
# settings.toml (both already in the lock through GPUI).
toml = "0.8"
toml_edit = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.dev]
debug = "limited"

# Debug builds decode 70 full-size PNG frames at start: the pixel crates run optimised.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

# GPUI's X11 backend, patched (vendor/gpui-pre-linux/PATCHES.md): a pure window move no longer
# re-renders and presents the whole window, nor does a GetGeometry round trip.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
